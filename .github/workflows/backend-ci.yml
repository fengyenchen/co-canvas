name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and verify migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: co_canvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d co_canvas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      AI_MODE: mock
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/co_canvas_test
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/co_canvas_test
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python imports
        run: |
          python -m compileall -q app alembic tests
          python -c "from app.main import app; assert app.title == 'Co-Canvas API'"

      - name: Run tests
        run: python -m pytest

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check model and migration consistency
        run: python -m alembic check
